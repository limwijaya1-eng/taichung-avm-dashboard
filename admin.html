<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市都市計畫使用分區法規資料庫 - 後台維護管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header Admin -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-2xl">⚙️</span>
            <div>
                <h1 class="text-lg font-bold">法規資料維護系統 (Zoning Database CMS)</h1>
                <p class="text-xs text-slate-400">table: taichung_urban_planning_all_zoning</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                ⬅️ 返回查詢儀表板 (Dashboard)
            </a>
            <button onclick="openModal('add')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition cursor-pointer shadow-sm">
                ➕ 新增分區規定
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 flex flex-col gap-4">
        
        <!-- Bar Pencarian -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2 w-full sm:w-96">
                <input type="text" id="searchInput" placeholder="搜尋分區名稱或計畫案 (例: 第一種住宅區)" class="px-3 py-2 text-sm border border-slate-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="loadTableData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 text-sm font-semibold rounded-lg transition cursor-pointer">
                    搜尋
                </button>
            </div>
            <span id="recordCount" class="text-xs font-bold text-slate-500">共載入 0 筆資料</span>
        </div>

        <!-- Tabel Data -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold text-xs uppercase">
                            <th class="p-3">ID</th>
                            <th class="p-3">使用分區／用地名稱</th>
                            <th class="p-3">分區類別</th>
                            <th class="p-3">計畫案名稱</th>
                            <th class="p-3 text-center">建蔽率</th>
                            <th class="p-3 text-center">容積率(基準)</th>
                            <th class="p-3 text-center">法規PDF附件</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <tr><td colspan="8" class="p-4 text-center text-slate-400">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Form (Drawer Pop-up Tambah & Edit) -->
    <div id="formModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-4xl max-h-[92vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-fade-in">
            
            <!-- Modal Header -->
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between shrink-0">
                <h3 id="modalTitle" class="text-base font-bold">新增分區規定</h3>
                <button onclick="closeModal()" class="text-white hover:text-red-400 text-2xl font-light leading-none cursor-pointer">&times;</button>
            </div>

            <!-- Modal Body (Form Terstruktur) -->
            <form id="recordForm" onsubmit="submitForm(event)" class="p-5 overflow-y-auto flex flex-col gap-5 text-sm">
                <input type="hidden" id="form_id" value="">

                <!-- 1. 基本資訊 -->
                <div class="border border-indigo-100 bg-indigo-50/30 p-3.5 rounded-xl">
                    <h4 class="font-bold text-indigo-900 text-sm mb-2 border-b border-indigo-100 pb-1">1. 基本資訊</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">使用分區／用地名稱 * (必填，與圖資關聯鍵)</label>
                            <input type="text" id="m_zoning_doc" required class="w-full border border-slate-300 rounded p-1.5 text-sm font-bold text-purple-900 bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">分區類別</label>
                            <input type="text" id="m_zoning_cat" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">計畫區名稱</label>
                            <input type="text" id="m_plan_district" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">計畫案名稱</label>
                            <input type="text" id="m_plan_case" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                    </div>
                </div>

                <!-- 2. 版本治理 -->
                <div class="border border-slate-200 bg-slate-50/50 p-3.5 rounded-xl">
                    <h4 class="font-bold text-slate-700 text-sm mb-2 border-b border-slate-200 pb-1">2. 版本治理</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-700 mb-1">版本文號／日期</label>
                            <textarea id="m_version_date" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-700 mb-1">來源PDF檔名（快照）</label>
                            <input type="text" id="m_pdf_snapshot" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white font-mono text-xs">
                        </div>
                    </div>
                </div>

                <!-- 3. 強度管制 -->
                <div class="border border-emerald-100 bg-emerald-50/30 p-3.5 rounded-xl">
                    <h4 class="font-bold text-emerald-900 text-sm mb-2 border-b border-emerald-100 pb-1">3. 強度管制</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">建蔽率</label>
                            <input type="text" id="m_bcr" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">容積率（基準）</label>
                            <input type="text" id="m_far_base" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">建築物高度比／最高高度</label>
                            <input type="text" id="m_height" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div class="sm:col-span-3">
                            <label class="block text-xs font-medium text-slate-700 mb-1">容積率（上限）</label>
                            <textarea id="m_far_max" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">開挖率</label>
                            <input type="text" id="m_excavation" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-700 mb-1">最小基地面積</label>
                            <input type="text" id="m_min_site" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                    </div>
                </div>

                <!-- 4. 使用管制 -->
                <div class="border border-blue-100 bg-blue-50/30 p-3.5 rounded-xl">
                    <h4 class="font-bold text-blue-900 text-sm mb-2 border-b border-blue-100 pb-1">4. 使用管制</h4>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">容許使用規定</label>
                            <textarea id="m_permitted" rows="3" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">使用項目列舉方式</label>
                            <input type="text" id="m_enumeration" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                    </div>
                </div>

                <!-- 5. 退縮與開放空間 -->
                <div class="border border-teal-100 bg-teal-50/30 p-3.5 rounded-xl">
                    <h4 class="font-bold text-teal-900 text-sm mb-2 border-b border-teal-100 pb-1">5. 退縮與開放空間</h4>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">建築退縮規定</label>
                            <textarea id="m_setback" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">開放空間規定 (若含 圖七、圖八 儀表板自動支援 Lightbox)</label>
                            <textarea id="m_open_space" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 6. 停車與裝卸 -->
                <div class="border border-slate-200 bg-slate-50/50 p-3.5 rounded-xl">
                    <h4 class="font-bold text-slate-700 text-sm mb-2 border-b border-slate-200 pb-1">6. 停車與裝卸</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">停車設置基準</label>
                            <textarea id="m_parking" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">離街裝卸場規定</label>
                            <textarea id="m_loading" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 7. 獎勵與移轉 -->
                <div class="border border-amber-100 bg-amber-50/30 p-3.5 rounded-xl">
                    <h4 class="font-bold text-amber-900 text-sm mb-2 border-b border-amber-100 pb-1">7. 獎勵與移轉</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">容積獎勵規定</label>
                            <textarea id="m_bonus" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">容積移轉規定</label>
                            <textarea id="m_transfer" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 8. 審議與其他管制 -->
                <div class="border border-rose-100 bg-rose-50/30 p-3.5 rounded-xl">
                    <h4 class="font-bold text-rose-900 text-sm mb-2 border-b border-rose-100 pb-1">8. 審議與其他管制</h4>
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">都市設計審議門檻</label>
                            <textarea id="m_design_review" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">特殊條款／個案規定</label>
                            <textarea id="m_special_clauses" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">重疊管制規定</label>
                            <textarea id="m_overlap" rows="2" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 9. 治理與 PDF 上傳 -->
                <div class="border-2 border-dashed border-indigo-300 bg-indigo-50/50 p-4 rounded-xl">
                    <h4 class="font-bold text-indigo-900 text-sm mb-2 flex items-center gap-1.5">📄 9. 治理與法規 PDF 檔案上傳</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">資料建立日期</label>
                            <input type="text" id="m_created_date" placeholder="2026-09-12" class="w-full border border-slate-300 rounded p-1.5 text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-indigo-900 mb-1">上傳法規原始文件 PDF 檔案</label>
                            <input type="file" id="m_pdf_file" accept=".pdf" class="w-full border border-slate-300 rounded p-1 text-sm bg-white">
                            <p id="current_pdf_hint" class="text-xs text-slate-500 mt-1"></p>
                        </div>
                    </div>
                </div>

                <!-- Footer Action Buttons -->
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200 shrink-0">
                    <button type="button" onclick="closeModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition cursor-pointer">
                        取消
                    </button>
                    <button type="submit" id="saveBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition cursor-pointer shadow-sm">
                        儲存資料
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://evacuee-subzero-annuity.ngrok-free.dev";

        // Memuat Data saat Halaman Dibuka
        document.addEventListener("DOMContentLoaded", () => {
            loadTableData();
        });

        async function loadTableData() {
            const query = document.getElementById("searchInput").value;
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-slate-400">載入中...</td></tr>';

            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/zoning-records?search=${encodeURIComponent(query)}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const data = await res.json();
                document.getElementById("recordCount").innerText = `共載入 ${data.length} 筆資料`;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="p-4 text-center text-slate-400">查無資料</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => {
                    const pdfBadge = item.pdf_file_path && item.pdf_file_path.trim() !== ""
                        ? `<a href="${API_BASE_URL}/${item.pdf_file_path}" target="_blank" class="text-indigo-600 hover:underline font-bold text-xs">📄 開啟PDF</a>`
                        : `<span class="text-slate-300 text-xs">無附件</span>`;

                    return `
                        <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                            <td class="p-3 font-mono text-xs text-slate-500">${item.id}</td>
                            <td class="p-3 font-bold text-purple-950">${item['使用分區／用地名稱'] || '-'}</td>
                            <td class="p-3 text-slate-600">${item['分區類別'] || '-'}</td>
                            <td class="p-3 text-slate-700 max-w-xs truncate" title="${item['計畫案名稱']}">${item['計畫案名稱'] || '-'}</td>
                            <td class="p-3 text-center font-bold text-emerald-800">${item['建蔽率'] || '-'}</td>
                            <td class="p-3 text-center font-bold text-amber-800">${item['容積率（基準）'] || '-'}</td>
                            <td class="p-3 text-center">${pdfBadge}</td>
                            <td class="p-3 text-center">
                                <div class="inline-flex items-center gap-1.5">
                                    <button onclick="editRecord(${item.id})" class="px-2.5 py-1 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded text-xs font-bold transition cursor-pointer">
                                        ✏️ 編輯
                                    </button>
                                    <button onclick="deleteRecord(${item.id}, '${item['使用分區／用地名稱']}')" class="px-2.5 py-1 bg-red-50 text-red-600 hover:bg-red-100 rounded text-xs font-bold transition cursor-pointer">
                                        🗑️ 刪除
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500 font-bold">載入失敗: ${err.message}</td></tr>`;
            }
        }

        function openModal(mode) {
            document.getElementById("recordForm").reset();
            document.getElementById("form_id").value = "";
            document.getElementById("current_pdf_hint").innerText = "";
            
            if (mode === 'add') {
                document.getElementById("modalTitle").innerText = "➕ 新增分區規定";
                const today = new Date().toISOString().split('T')[0];
                document.getElementById("m_created_date").value = today;
            }
            document.getElementById("formModal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("formModal").classList.add("hidden");
        }

        async function editRecord(id) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/zoning-records/${id}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                const data = await res.json();

                document.getElementById("modalTitle").innerText = `✏️ 編輯分區規定 (ID: ${data.id})`;
                document.getElementById("form_id").value = data.id;

                document.getElementById("m_zoning_doc").value = data['使用分區／用地名稱'] || '';
                document.getElementById("m_zoning_cat").value = data['分區類別'] || '';
                document.getElementById("m_plan_district").value = data['計畫區名稱'] || '';
                document.getElementById("m_plan_case").value = data['計畫案名稱'] || '';
                document.getElementById("m_version_date").value = data['版本文號／日期'] || '';
                document.getElementById("m_pdf_snapshot").value = data['來源PDF檔名（快照）'] || '';
                document.getElementById("m_bcr").value = data['建蔽率'] || '';
                document.getElementById("m_far_base").value = data['容積率（基準）'] || '';
                document.getElementById("m_far_max").value = data['容積率（上限）'] || '';
                document.getElementById("m_height").value = data['建築物高度比／最高高度'] || '';
                document.getElementById("m_excavation").value = data['開挖率'] || '';
                document.getElementById("m_min_site").value = data['最小基地面積'] || '';
                document.getElementById("m_permitted").value = data['容許使用規定'] || '';
                document.getElementById("m_enumeration").value = data['使用項目列舉方式'] || '';
                document.getElementById("m_setback").value = data['建築退縮規定'] || '';
                document.getElementById("m_open_space").value = data['開放空間規定'] || '';
                document.getElementById("m_parking").value = data['停車設置基準'] || '';
                document.getElementById("m_loading").value = data['離街裝卸場規定'] || '';
                document.getElementById("m_bonus").value = data['容積獎勵規定'] || '';
                document.getElementById("m_transfer").value = data['容積移轉規定'] || '';
                document.getElementById("m_design_review").value = data['都市設計審議門檻'] || '';
                document.getElementById("m_special_clauses").value = data['特殊條款／個案規定'] || '';
                document.getElementById("m_overlap").value = data['重疊管制規定'] || '';
                document.getElementById("m_created_date").value = data['資料建立日期'] || '';

                if (data.pdf_file_path && data.pdf_file_path !== "") {
                    document.getElementById("current_pdf_hint").innerHTML = `現有檔案: <a href="${API_BASE_URL}/${data.pdf_file_path}" target="_blank" class="text-indigo-600 underline">${data.pdf_file_path}</a>`;
                } else {
                    document.getElementById("current_pdf_hint").innerText = "目前無關聯 PDF 檔案";
                }

                document.getElementById("formModal").classList.remove("hidden");
            } catch (err) {
                alert("無法取得資料: " + err.message);
            }
        }

        async function submitForm(e) {
            e.preventDefault();
            const id = document.getElementById("form_id").value;
            const isEdit = id !== "";

            const formData = new FormData();
            formData.append("zoning_doc", document.getElementById("m_zoning_doc").value);
            formData.append("zoning_cat", document.getElementById("m_zoning_cat").value);
            formData.append("plan_district", document.getElementById("m_plan_district").value);
            formData.append("plan_case", document.getElementById("m_plan_case").value);
            formData.append("version_date", document.getElementById("m_version_date").value);
            formData.append("pdf_snapshot", document.getElementById("m_pdf_snapshot").value);
            formData.append("bcr", document.getElementById("m_bcr").value);
            formData.append("far_base", document.getElementById("m_far_base").value);
            formData.append("far_max", document.getElementById("m_far_max").value);
            formData.append("height", document.getElementById("m_height").value);
            formData.append("excavation", document.getElementById("m_excavation").value);
            formData.append("min_site", document.getElementById("m_min_site").value);
            formData.append("permitted", document.getElementById("m_permitted").value);
            formData.append("enumeration", document.getElementById("m_enumeration").value);
            formData.append("setback", document.getElementById("m_setback").value);
            formData.append("open_space", document.getElementById("m_open_space").value);
            formData.append("parking", document.getElementById("m_parking").value);
            formData.append("loading", document.getElementById("m_loading").value);
            formData.append("bonus", document.getElementById("m_bonus").value);
            formData.append("transfer", document.getElementById("m_transfer").value);
            formData.append("design_review", document.getElementById("m_design_review").value);
            formData.append("special_clauses", document.getElementById("m_special_clauses").value);
            formData.append("overlap", document.getElementById("m_overlap").value);
            formData.append("created_date", document.getElementById("m_created_date").value);

            const fileInput = document.getElementById("m_pdf_file");
            if (fileInput.files.length > 0) {
                formData.append("pdf_file", fileInput.files[0]);
            }

            const url = isEdit ? `${API_BASE_URL}/api/v1/zoning-records/${id}` : `${API_BASE_URL}/api/v1/zoning-records`;
            const method = isEdit ? "PUT" : "POST";

            try {
                const res = await fetch(url, { method: method, body: formData });
                if (!res.ok) throw new Error("儲存失敗");
                alert(isEdit ? "更新成功！" : "新增成功！");
                closeModal();
                loadTableData();
            } catch (err) {
                alert("操作失敗: " + err.message);
            }
        }

        async function deleteRecord(id, name) {
            if (!confirm(`確定要刪除「${name}」這筆分區管制規定嗎？此操作無法復原。`)) return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/zoning-records/${id}`, { method: "DELETE" });
                if (!res.ok) throw new Error("刪除失敗");
                alert("已成功刪除該筆資料！");
                loadTableData();
            } catch (err) {
                alert("刪除失敗: " + err.message);
            }
        }
    </script>
</body>
</html>
